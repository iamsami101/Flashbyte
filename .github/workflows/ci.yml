name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub get -C packages/flashbyte_core

      - name: Analyze
        run: flutter analyze

  harness:
    name: Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub get -C packages/flashbyte_core

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests (app)
        run: flutter test

      - name: Unit tests (flashbyte_core)
        working-directory: packages/flashbyte_core
        run: dart test

      - name: Transfer integration test
        run: dart run tool/transfer_integration_test.dart

