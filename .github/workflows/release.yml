name: Build and Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Collect Android artifacts
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-release.apk release/android/flashbyte-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release/android/flashbyte-android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/android/*

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          mkdir -p release/linux
          tar -czf release/linux/flashbyte-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/linux/*

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/windows/flashbyte-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/windows/*

  build-apple:
    name: iOS and macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS DMG
        uses: L-Super/create-dmg-actions@v1.0.3
        with:
          dmg_name: flashbyte-macos
          src_dir: build/macos/Build/Products/Release/flashbyte.app

      - name: Package Apple artifacts
        run: |
          mkdir -p release/apple
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release/apple/flashbyte-ios-unsigned-runner-app.zip
          dmg_path="$(find . -maxdepth 3 -name 'flashbyte-macos*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "flashbyte-macos DMG was not created"
            find . -maxdepth 3 -name '*.dmg' -print
            exit 1
          fi
          cp "$dmg_path" release/apple/flashbyte-macos.dmg

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: release/apple/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-linux
      - build-windows
      - build-apple
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Read app version
        id: app-version
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Flashbyte ${{ steps.app-version.outputs.version }}
          body: |
            Flashbyte ${{ steps.app-version.outputs.version }}

            Commit: `${{ github.sha }}`.

            Artifacts:
            - Android APK and AAB
            - Linux x64 bundle
            - Windows x64 bundle
            - macOS DMG
            - unsigned iOS Runner.app bundle
          files: release-assets/**/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: Commit README release links
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: build-${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            python3 - <<'PY'
          from pathlib import Path
          import os
          import textwrap

          readme = Path("README.md")
          text = readme.read_text()
          start = "<!-- BEGIN AUTO RELEASE DOWNLOADS -->"
          end = "<!-- END AUTO RELEASE DOWNLOADS -->"
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          section = textwrap.dedent(f"""\
          {start}
          | Platform | Download |
          |----------|----------|
          | Android | [APK]({base}/flashbyte-android.apk) \\| [AAB]({base}/flashbyte-android.aab) |
          | Linux | [Linux tarball]({base}/flashbyte-linux-x64.tar.gz) |
          | macOS | [DMG installer]({base}/flashbyte-macos.dmg) |
          | iOS | [Unsigned Runner.app zip]({base}/flashbyte-ios-unsigned-runner-app.zip) |
          | Windows | [Windows zip]({base}/flashbyte-windows-x64.zip) |
          {end}""")
          before, marker, rest = text.partition(start)
          if not marker:
              raise SystemExit("README release download start marker not found")
          _, marker, after = rest.partition(end)
          if not marker:
              raise SystemExit("README release download end marker not found")
          readme.write_text(before + section + after)
          PY

            if git diff --quiet README.md; then
              exit 0
            fi

            git add README.md
            git commit -m "docs: update release downloads [skip ci]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            git reset --hard HEAD~1
          done

          echo "Could not push README release links after 3 attempts."
          exit 1
